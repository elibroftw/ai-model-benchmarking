[project]
name = "sudoku-vision-benchmark"
version = "0.1.0"
description = "Grade LLMs on a Sudoku vision benchmark via OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sudoku-benchmark = "cli.run_benchmark:main"
