# Custom model endpoint definitions for sudoku-agent-harness.
#
# Every key under [custom_models] is the model ID you pass to --model.
# When that ID matches a key here, the corresponding LiteLLM settings
# are used INSTEAD of the default OpenRouter path.  LiteLLM prefixes
# the `provider` to the `model_name` so that its router selects the
# right completion path (e.g. "openai/qwen3.8-27b").
#
#   provider    LiteLLM provider prefix (openai, anthropic, etc.)
#   model_name  the name the endpoint knows the model by
#   api_base    base URL of the OpenAI-compatible server
#   api_key     auth key; "not-needed" for servers that don't check it
#
# Example: LM Studio running a local Qwen model on port 1234.
#
#   [custom_models.local-qwen]
#   provider = "openai"
#   model_name = "qwen3.8-27b"
#   api_base = "http://127.0.0.1:1234/v1"
#   api_key = "not-needed"

[custom_models."qwen3.8-27b@q8_k_xl"]
provider = "openai"
model_name = "qwen3.8-27b@q8_k_xl"
api_base = "http://127.0.0.1:1234/v1"
api_key = "not-needed"