"meta/muse-spark-1.2" = [1.25, 4.25]
"deepseek/deepseek-v4-pro-0813" = [0.66, 1.98]
"~deepseek/deepseek-v4-flash-latest" = [0.065, 0.18]
"z-ai/glm-5.2" = [0.336, 1.056]
"z-ai/glm-5.3" = [1.40, 4.40]
"qwen/qwen3.8-27b" = [0.40, 3.00]
"qwen/qwen3.8-2.4t-a95b" = [2.00, 6.00]
"deepseek/deepseek-v4-flash-vision-exp" = [0.22, 0.66]
"anthropic/claude-opus-5" = [5.00, 25.00]
"openai/gpt-5.6-sol-pro" = [2.00, 10.00]
"openai/gpt-5.6-sol" = [2.00, 10.00]
