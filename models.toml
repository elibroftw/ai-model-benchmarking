# Sudoku Vision Benchmark - models to test.
#
# A model is its OpenRouter model ID
# We will try to inference HF exclusive models in the future
#
# Mark a costly model inline and skip it with --skip-expensive:
#   { id = "vendor/model", expensive = true }
# Intelligence index: https://artificialanalysis.ai/evaluations/artificial-analysis-intelligence-index

[models]

open-weight = [
    # vision-capable

    # TODO: use https://www.reddit.com/r/LocalLLaMA/comments/1vsr67c/introducing_qwen3827b_dynamic_v3_unsloth_ggufs/
    "qwen/qwen3.8-27b",
    # This model will be open-weights in the future
    # https://x.com/finkd/status/2086755195535413696?s=20
    "meta/muse-spark-1.2",
    # will train on requests
    # "deepseek/deepseek-v4-flash-vision-exp"

    "google/gemma-4-31b-it",
    { id = "moonshotai/kimi-k3", expensive = true },
    "minimax/minimax-m3",
    "meta/muse-glimmer-30b",

    "thinkingmachines/inkling",
    "thinkingmachines/inkling-small",

    # text-only
    "qwen/qwen3.8-2.4t-a95b",
    "deepseek/deepseek-v4-pro-0813",
    "~deepseek/deepseek-v4-flash-latest",
    "xiaomi/mimo-v2.5-pro",
    "z-ai/glm-5.3",
    "z-ai/glm-5.2",
    # TODO: evaluate https://ornith.ai/ornith_1_5.html
]

# The so called Frontier
proprietary = [
    { id = "anthropic/claude-fable-5", expensive = true },
    "anthropic/claude-opus-5",
    "openai/gpt-5.6-sol",
    "openai/gpt-5.6-sol-pro",
    "qwen/qwen3.8-max",

    "google/gemini-3.7-flash",
    "x-ai/grok-4.6",
]

# baseline = [
#     "google/gemini-3.1-flash-lite-image",
#     "google/gemini-3.1-flash-image"
# ]

disabled = [
    # Resorted to cheating
    "moonshotai/kimi-k2.6",
    # Way too slow
    "xiaomi/mimo-v2.5",
    # trash
    "inclusionai/ling-3.0-flash",
]

# OpenRouter pricing per 1M tokens: [input, output].
# Keep in sync with https://openrouter.ai/models — these drift fast.
