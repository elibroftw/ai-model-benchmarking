[project]
name = "general-agent"
version = "0.1.0"
description = "A model-agnostic agent that stays focused via a skills system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
general-agent = "general_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["general_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
