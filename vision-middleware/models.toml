# Vision Middleware — model configuration.
#
# The vision middleware sends an image + task description to a vision-capable model
# (via OpenRouter) to produce a detailed text transcription that is supposed to help another AI model complete.
#
# This specific example of a vision middleware is used to create a transcription of sudoku puzzles
# that are handed to the solving agent alongside the image itself (for vision-capable models).
#
# We are looking for: high quality description, fast, affordable

# TODO: benchmark vision models by quality (human-rated), ai-quality (llm-performance), and speed (stat)
# INSPO:
# - https://www.reddit.com/r/LocalLLaMA/comments/1vyw1wo/forget_the_pelican_its_weeviltime/
# - https://www.reddit.com/r/LocalLLaMA/comments/1vp3zqc/a_nice_local_vision_test/
# - existing benchmarks: https://vlm-benchmarks-search.vercel.app/
# - OCR 1: https://mbzuai-nlp.github.io/TABVERSE/leaderboard.html
[vision]
# only open-weight to prevent training on transcribing tasks
# gemma4 is really fucking fast and good at this
model = "google/gemma-4-26b-a4b-it"

# OpenAI-compatible API endpoint
api_base = "https://openrouter.ai/api/v1"

# Inference knobs passed through to the completion call.
temperature = 0.0
max_tokens = 2000
