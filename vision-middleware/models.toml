# Vision Middleware — model configuration.
#
# The vision middleware sends puzzle images to a vision-capable model
# (via OpenRouter) to produce a detailed text transcription.  The
# transcription is then handed to the solving agent alongside (or
# instead of) the image, so text-only models can participate fairly.
#
# The model here should be strong at image description, affordable,
# and available through OpenRouter's chat completions API.

[vision]
# OpenRouter model ID for the image-transcription step.
model = "google/gemini-2.0-flash-001"

# OpenRouter API key source: either a literal value here, or the
# OPENROUTER_API_KEY environment variable (the default).
# api_key = "sk-or-v1-..."

# OpenRouter chat completions endpoint.
api_base = "https://openrouter.ai/api/v1"

# Inference knobs passed through to the completion call.
temperature = 0.0
max_tokens = 2000